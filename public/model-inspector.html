<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Inspector - MobileNetV2 Spiral</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    .status {
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: 600;
      text-align: center;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .card {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
    }
    .card h3 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 1.3em;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .info-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .info-item label {
      font-size: 0.9em;
      color: #666;
      display: block;
      margin-bottom: 5px;
    }
    .info-item value {
      font-size: 1.2em;
      font-weight: 600;
      color: #333;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }
    th {
      background: #667eea;
      color: white;
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }
    td {
      padding: 12px 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    tr:hover {
      background: #f8f9fa;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .model-viz {
      background: white;
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      min-height: 200px;
    }
    .layer-box {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 15px;
      margin: 10px auto;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .arrow {
      color: #667eea;
      font-size: 2em;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 Model Inspector</h1>
      <p>MobileNetV2 Spiral Drawing Classifier</p>
    </div>
    
    <div class="content">
      <div id="status" class="status loading">
        ⏳ Initializing TensorFlow.js...
      </div>
      
      <div style="text-align: center;">
        <button id="loadBtn" disabled>🚀 Load & Inspect Model</button>
      </div>
      
      <div id="basicInfo"></div>
      <div id="layerInfo"></div>
      <div id="visualization"></div>
    </div>
  </div>

  <script>
    let model = null;
    const statusDiv = document.getElementById('status');
    const basicInfoDiv = document.getElementById('basicInfo');
    const layerInfoDiv = document.getElementById('layerInfo');
    const visualizationDiv = document.getElementById('visualization');
    const loadBtn = document.getElementById('loadBtn');

    function updateStatus(message, type = 'loading') {
      statusDiv.className = `status ${type}`;
      statusDiv.innerHTML = message;
    }

    async function initialize() {
      try {
        await tf.setBackend('webgl');
        await tf.ready();
        updateStatus(`✅ TensorFlow.js Ready | Backend: ${tf.getBackend()} | Version: ${tf.version.tfjs}`, 'success');
        loadBtn.disabled = false;
      } catch (error) {
        updateStatus(`❌ Initialization Failed: ${error.message}`, 'error');
      }
    }

    async function loadAndInspectModel() {
      loadBtn.disabled = true;
      updateStatus('⏳ Loading model...', 'loading');
      
      try {
        const modelPath = '/models/spiral/mobilenet_spiral.h5';
        model = await tf.loadLayersModel(modelPath);
        
        updateStatus('✅ Model Loaded Successfully!', 'success');
        
        displayBasicInfo();
        displayLayerInfo();
        displayVisualization();
        
      } catch (error) {
        updateStatus(`❌ Failed to load model: ${error.message}`, 'error');
        console.error(error);
        loadBtn.disabled = false;
      }
    }

    function displayBasicInfo() {
      const inputShape = model.inputs[0].shape;
      const outputShape = model.outputs[0].shape;
      const numParams = model.countParams();
      const numLayers = model.layers.length;
      
      // Calculate trainable vs non-trainable
      let trainableParams = 0;
      let nonTrainableParams = 0;
      
      model.layers.forEach(layer => {
        const layerParams = layer.countParams();
        if (layer.trainable) {
          trainableParams += layerParams;
        } else {
          nonTrainableParams += layerParams;
        }
      });
      
      basicInfoDiv.innerHTML = `
        <div class="card">
          <h3>📊 Model Overview</h3>
          <div class="info-grid">
            <div class="info-item">
              <label>Model Name</label>
              <value>MobileNetV2 Spiral Classifier</value>
            </div>
            <div class="info-item">
              <label>Total Layers</label>
              <value>${numLayers}</value>
            </div>
            <div class="info-item">
              <label>Total Parameters</label>
              <value>${numParams.toLocaleString()}</value>
            </div>
            <div class="info-item">
              <label>Trainable Parameters</label>
              <value style="color: #4CAF50;">${trainableParams.toLocaleString()}</value>
            </div>
            <div class="info-item">
              <label>Non-trainable Parameters</label>
              <value style="color: #FF9800;">${nonTrainableParams.toLocaleString()}</value>
            </div>
            <div class="info-item">
              <label>Test Accuracy</label>
              <value style="color: #2196F3;">86.67%</value>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3>🔢 Input/Output Specifications</h3>
          <div class="info-grid">
            <div class="info-item">
              <label>Input Shape</label>
              <value>${JSON.stringify(inputShape)}</value>
            </div>
            <div class="info-item">
              <label>Output Shape</label>
              <value>${JSON.stringify(outputShape)}</value>
            </div>
            <div class="info-item">
              <label>Input Type</label>
              <value>RGB Image (224×224)</value>
            </div>
            <div class="info-item">
              <label>Preprocessing</label>
              <value>Scale to [-1, 1]</value>
            </div>
          </div>
        </div>
      `;
    }

    function displayLayerInfo() {
      let tableHTML = `
        <div class="card">
          <h3>🏗️ Layer Architecture</h3>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Layer Type</th>
                <th>Layer Name</th>
                <th>Output Shape</th>
                <th>Parameters</th>
                <th>Trainable</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      model.layers.forEach((layer, index) => {
        const outputShape = JSON.stringify(layer.outputShape);
        const params = layer.countParams().toLocaleString();
        const trainable = layer.trainable ? '✓' : '✗';
        const trainableColor = layer.trainable ? '#4CAF50' : '#FF9800';
        
        tableHTML += `
          <tr>
            <td><strong>${index + 1}</strong></td>
            <td>${layer.getClassName()}</td>
            <td><code>${layer.name}</code></td>
            <td>${outputShape}</td>
            <td>${params}</td>
            <td style="color: ${trainableColor}; font-weight: bold;">${trainable}</td>
          </tr>
        `;
      });
      
      tableHTML += `
            </tbody>
          </table>
        </div>
      `;
      
      layerInfoDiv.innerHTML = tableHTML;
    }

    function displayVisualization() {
      const importantLayers = [
        { name: 'Input Layer', shape: '[224, 224, 3]', color: '#667eea' },
        { name: 'MobileNetV2 Base', shape: '[7, 7, 1280]', color: '#764ba2' },
        { name: 'Global Average Pooling', shape: '[1280]', color: '#f093fb' },
        { name: 'Dense (256 units)', shape: '[256]', color: '#f5576c' },
        { name: 'Dropout (0.5)', shape: '[256]', color: '#4facfe' },
        { name: 'Output Layer', shape: '[2]', color: '#00f2fe' }
      ];
      
      let vizHTML = `
        <div class="card">
          <h3>📐 Architecture Visualization</h3>
          <div class="model-viz">
      `;
      
      importantLayers.forEach((layer, index) => {
        vizHTML += `
          <div class="layer-box" style="background: linear-gradient(135deg, ${layer.color} 0%, ${layer.color}dd 100%);">
            <strong>${layer.name}</strong><br>
            <small>Shape: ${layer.shape}</small>
          </div>
        `;
        if (index < importantLayers.length - 1) {
          vizHTML += '<div class="arrow">↓</div>';
        }
      });
      
      vizHTML += `
          </div>
          <div class="info-item" style="margin-top: 20px;">
            <label>Model Type</label>
            <p>Transfer Learning with Fine-tuning</p>
            <p style="margin-top: 10px; color: #666;">
              Pre-trained MobileNetV2 on ImageNet, fine-tuned on spiral drawing dataset.
              The model uses depthwise separable convolutions for efficient computation.
            </p>
          </div>
        </div>
      `;
      
      visualizationDiv.innerHTML = vizHTML;
    }

    loadBtn.addEventListener('click', loadAndInspectModel);
    initialize();
  </script>
</body>
</html>
